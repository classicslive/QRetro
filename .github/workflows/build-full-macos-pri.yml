name: macOS include build with all optional modules

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 5's macOS binaries are x86_64 only, so Qt 5 is covered on the
          # Intel runner and Qt 6 on the Apple Silicon one. Between them every
          # Q_OS_MACOS path gets compiled on both Qt majors and both arches.
          - runner: macos-13
            qt: '5.15.2'
            archives: 'qtbase qtmultimedia qtgamepad qtlocation qtsensors'
            modules: ''
          - runner: macos-14
            qt: '6.8.*'
            archives: 'qtbase'
            modules: 'qtmultimedia'

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        archives: ${{ matrix.archives }}
        modules: ${{ matrix.modules }}
    - name: Build
      run: qmake && make -j"$(sysctl -n hw.ncpu)"
